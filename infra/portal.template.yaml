AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  RunPass portal de administracao (candidato, NAO implantado): pagina estatica em S3 + CloudFront e a API
  so para operadores. O login e feito direto no Cognito; a API confere MFA obrigatorio do pool, sessao
  recente e acesso ativo (ver backend/runpass/admin_api.py).

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  DataStack:
    Type: String
    Description: Stack data.template.yaml aplicada
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
    Description: Zip da API (scripts/package-lambda.sh), o mesmo da API dos corredores
  RunnerUserPoolId:
    Type: String
    AllowedPattern: '^[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]+$'
  RunnerClientId:
    Type: String
  OperatorUserPoolId:
    Type: String
    AllowedPattern: '^[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]+$'
  OperatorClientId:
    Type: String
  ErasureHmacParameter:
    Type: String
    AllowedPattern: '^/.+'
  CursorKeyParameter:
    Type: String
    AllowedPattern: '^/.+'
  ApiRateLimit:
    Type: Number
    Default: 10
  ApiBurstLimit:
    Type: Number
    Default: 20

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # ---- hospedagem da pagina -------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoOCloudFrontDesteSite
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: SoHttps
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: 'false'}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'runpass-${Environment}-portal'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub 'runpass-${Environment}-portal-seguranca'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            # Scripts e estilos so do proprio site; conexoes so ao login (Cognito) e a API do portal.
            ContentSecurityPolicy: !Sub >-
              default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;
              connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com;
              base-uri 'none'; form-action 'self'; frame-ancestors 'none'
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: no-referrer, Override: true}
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'RunPass ${Environment} portal de administracao'
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # CachingDisabled: poucas visitas, e o JavaScript novo precisa valer na hora.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: !Ref SecurityHeaders

  # ---- API so para operadores --------------------------------------------------------------------
  AdminFunctionLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  AdminFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: minimo-privilegio
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt AdminFunctionLogs.Arn
              - Sid: AcessoSessaoPedidosEdicoes
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
                Resource:
                  - !Sub
                    - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Name}'
                    - Name: {Fn::ImportValue: !Sub '${DataStack}-IdentityTable'}
                  - !Sub
                    - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Name}'
                    - Name: {Fn::ImportValue: !Sub '${DataStack}-OperationsTable'}
                  - !Sub
                    - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Name}'
                    - Name: {Fn::ImportValue: !Sub '${DataStack}-HistoryTable'}
                  - !Sub
                    - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Name}'
                    - Name: {Fn::ImportValue: !Sub '${DataStack}-CatalogTable'}
              - Sid: LerNotasDasEdicoes
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub
                  - 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Name}'
                  - Name: {Fn::ImportValue: !Sub '${DataStack}-ProjectionsTable'}
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['EDITION#*']
              - Sid: ConferirMfaDoPoolDeOperadores
                Effect: Allow
                Action: cognito-idp:DescribeUserPool
                Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${OperatorUserPoolId}'
              - Sid: SegredosNaInicializacao
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ErasureHmacParameter}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CursorKeyParameter}'

  AdminFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      Handler: runpass.admin_entry.handler
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      MemorySize: 512
      Timeout: 20
      Role: !GetAtt AdminFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref AdminFunctionLogs
      Environment:
        Variables:
          RUNPASS_ENV: !Ref Environment
          RUNPASS_RUNNER_ISSUER: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${RunnerUserPoolId}'
          RUNPASS_RUNNER_CLIENT_ID: !Ref RunnerClientId
          RUNPASS_RUNNER_USER_POOL_ID: !Ref RunnerUserPoolId
          RUNPASS_ERASURE_HMAC_PARAM: !Ref ErasureHmacParameter
          RUNPASS_CURSOR_KEY_PARAM: !Ref CursorKeyParameter
          RUNPASS_IDENTITY_TABLE: {Fn::ImportValue: !Sub '${DataStack}-IdentityTable'}
          RUNPASS_OPERATIONS_TABLE: {Fn::ImportValue: !Sub '${DataStack}-OperationsTable'}
          RUNPASS_ERASURE_TABLE: {Fn::ImportValue: !Sub '${DataStack}-ErasureControlTable'}
          RUNPASS_CATALOG_TABLE: {Fn::ImportValue: !Sub '${DataStack}-CatalogTable'}
          RUNPASS_HISTORY_TABLE: {Fn::ImportValue: !Sub '${DataStack}-HistoryTable'}
          RUNPASS_PROJECTIONS_TABLE: {Fn::ImportValue: !Sub '${DataStack}-ProjectionsTable'}
          RUNPASS_OPERATOR_ISSUER: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${OperatorUserPoolId}'
          RUNPASS_OPERATOR_CLIENT_ID: !Ref OperatorClientId
          RUNPASS_OPERATOR_POOL_ID: !Ref OperatorUserPoolId
          # Unica origem aceita no CORS: a propria pagina do portal.
          RUNPASS_PORTAL_ORIGIN: !Sub 'https://${Distribution.DomainName}'
      Tags:
        - {Key: Project, Value: RunPass}
        - {Key: Environment, Value: !Ref Environment}

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'runpass-${Environment}-admin'
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 20000

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub 'integrations/${HttpApiIntegration}'

  HttpApiLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RetentionInDays: !If [IsProd, 30, 7]

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiRateLimit
        ThrottlingBurstLimit: !Ref ApiBurstLimit
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiLogs.Arn
        # Caminhos trazem ids de pedidos; so metodo, status e latencia sao registrados.
        Format: '{"requestId":"$context.requestId","method":"$context.httpMethod","status":"$context.status","latencyMs":"$context.responseLatency"}'

  HttpApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AdminFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

Outputs:
  PortalUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
