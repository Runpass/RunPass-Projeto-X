name: runpass
description: "Aplicativo RunPass para Android e iPhone."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '3.47.7'

dependencies:
  crop_your_image: ^2.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/medal_frames/
